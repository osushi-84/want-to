<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やりたいことリスト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="noise" aria-hidden="true"></div>

<!-- ══ HERO ══ -->
<header class="hero">
  <div class="hero-aura"  aria-hidden="true"></div>
  <div class="hero-kanji" aria-hidden="true">夢</div>
  <div class="hero-rule"  aria-hidden="true"></div>

  <p class="hero-eyebrow">Bucket&nbsp;&nbsp;List</p>
  <h1 class="hero-title">やりたいこと<em>リスト</em></h1>

  <div class="hero-stats">
    <div>
      <div class="hero-stat__n" id="yariCount">0</div>
      <div class="hero-stat__l">やりたいこと</div>
    </div>
    <div>
      <div class="hero-stat__n" id="tryCount">0</div>
      <div class="hero-stat__l">やってみたいこと</div>
    </div>
    <div>
      <div class="hero-stat__n" id="artistCount">0</div>
      <div class="hero-stat__l">見たいアーティスト</div>
    </div>
  </div>

  <div class="hero-scroll" aria-hidden="true">
    scroll
    <div class="hero-scroll-bar"></div>
  </div>
</header>

<div class="sep"></div>

<!-- ══ YARI LIST ══ -->
<section class="section" id="yari">
  <div class="eyebrow">— Want&nbsp;to&nbsp;Do —</div>
  <h2 class="sec-title">やりたいこと</h2>
  <div class="carousel-wrap" id="yariWrap"></div>
</section>

<div class="sep"></div>

<!-- ══ BUCKET LIST ══ -->
<section class="section" id="list">
  <div class="eyebrow">— Things&nbsp;to&nbsp;Try —</div>
  <h2 class="sec-title">やってみたいこと</h2>
  <div class="carousel-wrap" id="carouselWrap"></div>
</section>

<div class="sep"></div>

<!-- ══ LIVE SECTION ══ -->
<section class="section live-section" id="live">
  <div class="eyebrow">— Special —</div>
  <h2 class="sec-title">
    🎵&thinsp;行きたいライブ
    <span class="live-badge" id="artistBadge">0 artists</span>
  </h2>
  <div class="sphere-wrap" id="sphereWrap"></div>
</section>

<!-- ══ FOOTER ══ -->
<footer>
  <p class="footer-tag">やりたいことリスト&nbsp;/&nbsp;更新中</p>
</footer>

<script src="./script.js"></script>
</body>
</html>
